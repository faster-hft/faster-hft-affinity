# Test configuration for affinity library
# Disables features that might cause initialization failures in test environments

# Core features - keep enabled for basic testing
affinity.enabled=true
affinity.parameter_validation.enabled=true
affinity.caching.enabled=false

# Platform-specific features - disabled for test stability
affinity.performance_counters.enabled=false
affinity.numa_operations.enabled=false
affinity.irq_management.enabled=false

# HFT features - disabled for basic testing
affinity.hft.governor_control.enabled=false
affinity.hft.hugepage.enabled=false
affinity.hft.memory_prefetching.enabled=false

# Timeouts and retries
affinity.operation_timeout_ms=5000
affinity.max_retries=1

# Logging and debugging
affinity.developer_mode=true