name: Deploy Documentation

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-docs-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-docs-m2
            ${{ runner.os }}-m2

      - name: Build project
        run: mvn clean compile -B -q

      - name: Generate JavaDoc
        run: |
          echo "Generating JavaDoc..."
          mvn javadoc:javadoc -B

          # Check if JavaDoc was generated
          if [[ -d "target/site/apidocs" ]]; then
            echo "✅ JavaDoc generated successfully"
            ls -la target/site/apidocs/
          else
            echo "❌ JavaDoc generation failed"
            find target/ -name "*.html" -o -name "apidocs" 2>/dev/null || echo "No HTML files found"
            exit 1
          fi

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy JavaDoc to gh-pages
        run: |
          # Ensure api directory exists
          mkdir -p gh-pages/api

          # Copy JavaDoc
          if [[ -d "target/site/apidocs" ]]; then
            cp -r target/site/apidocs/* gh-pages/api/
            echo "✅ JavaDoc copied to gh-pages/api/"
          else
            echo "❌ No JavaDoc found to copy"
            exit 1
          fi

      - name: Create documentation index
        run: |
          cd gh-pages
          # index.html already exists with redirect, just update timestamp
          sed -i "s/Generated on .*/Generated on $(date)/" index.html || true
          echo "✅ Documentation index updated"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "📚 Documentation deployed successfully!"
          echo "🌐 Documentation redirect: https://faster-hft.github.io/faster-thread-affinity/"
          echo "📖 JavaDoc API: https://faster-hft.github.io/faster-thread-affinity/api/"
          echo "📋 Source Documentation: https://github.com/faster-hft/faster-thread-affinity"